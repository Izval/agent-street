name = "agent-street-hire-x402"
main = "src/index.ts"
compatibility_date = "2026-08-17"

# Historial de contrataciones por wallet ("Mis agentes"). En dev local (--local)
# miniflare simula el KV sin id real. Para PROD crea el namespace y pon el id:
#   wrangler kv namespace create HIRES_KV   → pega el id devuelto aquí.
[[kv_namespaces]]
binding = "HIRES_KV"
id = "1155928dc3de4ba585a4c3517064ffa5"
preview_id = "1155928dc3de4ba585a4c3517064ffa5"

[vars]
ALLOWED_ORIGIN = "*"
# RPC público BSC testnet (chainId 97). Keyless; solo lectura (verificación de tx).
BSC_TESTNET_RPC = "https://data-seed-prebsc-1-s1.bnbchain.org:8545"
# Token de settlement del marketplace en testnet = USDT (stable, como será en prod).
# El worker soporta ERC-20 y nativo; para pagar en tBNB pon PAYMENT_TOKEN="native".
PAYMENT_TOKEN = "0x337610d27c682E347C9cD60BD4b3b107C9d34dDd"
PAYMENT_TOKEN_SYMBOL = "USDT"
PAYMENT_TOKEN_DECIMALS = "18"
# Precio del listing en unidades base: 0.1 USDT (18 dec). Espeja studio.toml (0.1 $U).
HIRE_PRICE_BASE = "100000000000000000"
EXPLORER_BASE = "https://testnet.bscscan.com"
# 8004-proxy para resolver la wallet de cobro del agente (payTo del quote).
PROXY_8004_URL = "https://agent-street-8004-proxy.zevlat.workers.dev"
# No FLAGSHIP override (CLAUDE.md §2): every listing — IVL included — resolves its
# payout wallet generically from its on-chain 8004scan record. IVL is hired through
# its real on-chain agent, not a seed-injected payTo.
# Contrato KeyStore de Altana en chain 97 (manage flow · sesiones). Dirección
# PÚBLICA del contrato (no una llave) para el link "ver en el keystore explorer".
ALTANA_KEYSTORE = "0x6b8361C29d05D498b1a12B54A37310f94171E94A"

# Service binding al 8004-proxy (composición worker-a-worker en la misma cuenta;
# un fetch por *.workers.dev haría loopback/404). Local dev cae al fetch de PROXY_8004_URL.
[[services]]
binding = "PROXY_8004"
service = "agent-street-8004-proxy"

# Sin secrets: el usuario firma/paga desde su propia wallet (client-pays). Este
# worker solo verifica onchain vía RPC público — no custodia claves.
