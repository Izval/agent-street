# 8004-proxy — Worker de datos del marketplace (agent-street).
# Proyecto SEPARADO del Pages/app; se despliega con `wrangler deploy` desde este dir.
name = "agent-street-8004-proxy"
main = "src/index.ts"
compatibility_date = "2026-08-17"

# Cache de listados/fichas de agentes. Crear los namespaces reales antes del deploy:
#   wrangler kv namespace create AGENTS_KV
#   wrangler kv namespace create AGENTS_KV --preview
# y pegar los ids aquí. Para `wrangler dev`, Miniflare simula KV sin ids reales.
[[kv_namespaces]]
binding = "AGENTS_KV"
id = "48df5fb2f0114b788b96093eac73ee4f"
preview_id = "09098ef7959a4625b62f438c749c78b9"

[vars]
# CORS: el front (Pages) consumirá este proxy. Ajustar al dominio real en prod.
ALLOWED_ORIGIN = "*"
# Base de la 8004scan Public API (verificada en vivo 17-ago-2026).
SCAN_8004_BASE = "https://8004scan.io/api/v1/public"

# Secret opcional (no en el repo):  wrangler secret put SCAN_8004_API_KEY
# La API funciona ANÓNIMA (~10 req/min); la key Pro solo sube el rate-limit.

# Secret opcional para "Crea tu propio agente":  wrangler secret put SUBMIT_TOKEN
# Si se setea, protege el POST /v1/submitted (el registrar/front debe enviar el header
# `x-submit-token`). Ausente ⇒ el endpoint queda abierto (ok en dev local).
