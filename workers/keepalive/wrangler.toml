# keepalive — cron Worker que pinga servicios free-tier para que NUNCA se duerman
# (Render free hace spin-down a los ~15 min de inactividad). Genérico: pinga cada
# URL de KEEPALIVE_URLS (separadas por coma) — los targets son config pura, sin
# acoplamiento. Proyecto SEPARADO del Pages/app; se despliega con `wrangler deploy`.
#
#   Dev local:            npx wrangler dev --port 8795 --local
#   Disparar el cron:     curl "http://localhost:8795/__scheduled?cron=*/5+*+*+*+*"
name = "agent-street-keepalive"
main = "src/index.ts"
compatibility_date = "2026-08-17"
workers_dev = true

# Cada 5 minutos (bien por debajo del spin-down de ~15 min de Render free).
[triggers]
crons = ["*/5 * * * *"]

[vars]
# URLs de health a mantener calientes, separadas por coma. Rellenar tras los deploys, p.ej.:
#   "https://agent-street-registrar.onrender.com/health,https://ivl-rebalancer.onrender.com/ping"
# Se puede actualizar SIN redeploy desde el dashboard (Settings → Variables) o:
#   wrangler deploy   (tras editar aquí)
KEEPALIVE_URLS = "https://ivl.onrender.com/ping,https://ivl-mainnet.onrender.com/ping"
