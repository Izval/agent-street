# analytics — Worker de analítica de demanda (agent-street).
# Trending HONESTO por eventos propios (views + hires que contamos nosotros).
# Proyecto SEPARADO del Pages/app; se despliega con `wrangler deploy` desde este dir.
#
# Dev (no choca con el 8004-proxy en :8788):
#   npx wrangler dev --port 8790 --inspector-port 9340 --local
name = "agent-street-analytics"
main = "src/index.ts"
compatibility_date = "2026-08-17"

# Contadores de demanda por hora + índice de agentes activos + dedup + cache de meta.
# Crear los namespaces reales antes del deploy:
#   wrangler kv namespace create ANALYTICS_KV
#   wrangler kv namespace create ANALYTICS_KV --preview
# y pegar los ids aquí. Para `wrangler dev --local`, Miniflare simula KV sin ids reales.
[[kv_namespaces]]
binding = "ANALYTICS_KV"
id = "d846cf6864d941bfb44a3d6d5adcabf5"
preview_id = "f79a3a06315e4e1c8d39b415d430e3fe"

[vars]
# CORS: el front (Pages) POSTeará eventos y leerá trending. Ajustar al dominio real en prod.
ALLOWED_ORIGIN = "*"
# Base del Worker 8004-proxy para enriquecer name/imageUrl/category de los top N.
# Prod: el 8004-proxy desplegado. (Dev local: http://localhost:8788.)
PROXY_8004_URL = "https://agent-street-8004-proxy.zevlat.workers.dev"
